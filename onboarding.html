<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Complete profile · Campus Connect</title>
<link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/components.css">
</head><body data-page="onboarding"><main class="page-shell"><section class="auth-card">
<div class="eyebrow">Campus Connect</div><h1>Complete your profile</h1><p class="muted">A few details help personalize your campus community.</p>
<form id="onboardingForm" class="stack">
<label>Full name<input id="fullName" required maxlength="80"></label>
<label>Course<input id="course" maxlength="80" placeholder="B.Tech"></label>
<label>Branch<input id="branch" maxlength="80" placeholder="CSE"></label>
<label>Year<select id="year"><option value="">Select year</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></label>
<label>Section<input id="section" maxlength="20"></label>
<label>College<input id="college" maxlength="120"></label>
<label>Bio<textarea id="bio" maxlength="240" rows="3"></textarea></label>
<button class="btn btn-primary" type="submit">Save profile</button><p id="status" class="muted"></p>
</form></section></main><script type="module" src="js/onboarding.js"></script><script type="module" src="js/performance.js"></script></body></html>
