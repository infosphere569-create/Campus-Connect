<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>(function(){try{var v=localStorage.getItem("cc-theme")||"system";document.documentElement.dataset.theme=v==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):v;}catch(e){}})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in — Hackathons · Campus Connect One</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#178a54">
<link rel="icon" type="image/png" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/hackathons.css">
</head>
<body class="hk-body" data-page="hk-login">
<canvas class="hk-bg" id="hkBg" aria-hidden="true"></canvas>
<div class="hk-layer hk-auth">
  <div class="hk-glass hk-auth-box">
    <div class="hk-auth-top">
      <a class="hk-brand" href="hackthons.html"><img src="icon.png" alt="Campus Connect One logo" width="38" height="38"><span>Campus Connect One<small class="hk-brand-sub"><i data-lucide="terminal"></i><span>Hackathons</span></small></span></a>
      <div style="display:flex;gap:6px"><button class="hk-btn icon ghost" id="themeBtn" aria-label="Toggle theme"><i data-lucide="sun-moon"></i></button><a class="hk-btn icon ghost" href="hackthons.html" aria-label="Back to hackathons home"><i data-lucide="x"></i></a></div>
    </div>

    <h1 id="title">How do you want to <span class="hk-grad-text">join in?</span></h1>
    <p class="hk-muted" id="sub">Pick your side. It stays fixed for this session. To use the other side, log out and log in again.</p>
    <div id="signedBar" class="hk-msg ok hk-hidden" style="margin-top:16px"></div>

    <div class="hk-roles" role="group" aria-label="Choose a role">
      <button class="hk-role p" data-role="participant" type="button" aria-pressed="false">
        <span class="ri"><i data-lucide="rocket"></i></span><h3>As a participant</h3><p>Discover, register and compete in hackathons.</p>
        <ul><li><i data-lucide="check"></i>Your campus &amp; nearest events</li><li><i data-lucide="check"></i>Solo or team registration</li><li><i data-lucide="check"></i>Live updates from hosts</li></ul>
        <span class="pick">Continue <i data-lucide="arrow-right"></i></span>
      </button>
      <button class="hk-role h" data-role="host" type="button" aria-pressed="false">
        <span class="ri"><i data-lucide="megaphone"></i></span><h3>As a host</h3><p>Create a hackathon and manage everything in one place.</p>
        <ul><li><i data-lucide="check"></i>Guided create &amp; submit for approval</li><li><i data-lucide="check"></i>Registrations &amp; CSV export</li><li><i data-lucide="check"></i>Announce to all registrants</li></ul>
        <span class="pick">Continue <i data-lucide="arrow-right"></i></span>
      </button>
    </div>

    <div id="formWrap" class="hk-auth-form hk-hidden">
      <div class="hk-seg" id="modeSeg" style="margin-bottom:18px"><button class="on" data-mode="login" type="button">Log in</button><button data-mode="register" type="button">Create account</button></div>
      <div id="msg" class="hk-hidden" role="alert"></div>
      <form id="form" class="hk-form" novalidate>
        <div id="regOnly" class="hk-form hk-hidden">
          <div class="hk-field"><label for="name">Full name</label><input class="hk-input" id="name" autocomplete="name" placeholder="Your name"></div>
          <div class="hk-grid2">
            <div class="hk-field"><label for="college">College <small>for “your campus”</small></label><input class="hk-input" id="college" autocomplete="organization" placeholder="e.g. IIT Delhi"></div>
            <div class="hk-field"><label for="city">City</label><input class="hk-input" id="city" list="cityList" placeholder="e.g. Prayagraj"><datalist id="cityList"></datalist></div>
          </div>
        </div>
        <div class="hk-field"><label for="email">Email</label><input class="hk-input" id="email" type="email" autocomplete="email" placeholder="you@gmail.com" required></div>
        <div class="hk-field"><label for="password">Password</label><div class="hk-pw"><input class="hk-input" id="password" type="password" autocomplete="current-password" minlength="6" required style="padding-right:52px"><button class="hk-btn" type="button" id="togglePw" aria-label="Show password"><i data-lucide="eye"></i></button></div></div>
        <button class="hk-btn primary lg block" type="submit" id="submitBtn">Log in <i data-lucide="arrow-right"></i></button>
        <div class="hk-divider">or</div>
        <button class="hk-btn block" type="button" id="googleBtn"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>Continue with Google</button>
        <button class="hk-btn ghost block" type="button" id="forgotBtn">Forgot password?</button>
      </form>
      <button class="hk-btn ghost block" type="button" id="backBtn" style="margin-top:6px"><i data-lucide="arrow-left"></i>Change role</button>
    </div>
    <p class="hk-hint" style="text-align:center;margin-top:20px">By continuing you agree to keep the community respectful and safe. Same account as <a href="home.html" style="text-decoration:underline">Campus Connect One</a>.</p>
  </div>
</div>
<script src="js/hackathons/hk-icons.js"></script>
<script type="module" src="js/hackathons/hk-login.js"></script>
</body>
</html>
