<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Settings · Campus Connect</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/components.css">
</head><body><main class="page-shell"><section class="card settings-card"><div class="eyebrow">Campus Connect</div><h1>Settings</h1>
<form id="settingsForm" class="stack">
<h3>Privacy</h3><label>Profile visibility<select id="profileVisibility"><option value="campus">Campus</option><option value="private">Private</option></select></label>
<label class="check-row"><input type="checkbox" id="showEmail"> Show email on profile</label>
<h3>Notifications</h3>
<label class="check-row"><input type="checkbox" id="likes"> Likes</label><label class="check-row"><input type="checkbox" id="comments"> Comments</label>
<label class="check-row"><input type="checkbox" id="groups"> Groups</label><label class="check-row"><input type="checkbox" id="events"> Events</label>
<button class="btn btn-primary">Save settings</button><p id="status" class="muted"></p>
</form></section></main><script type="module" src="js/settings-page.js"></script><script type="module" src="js/performance.js"></script></body></html>
